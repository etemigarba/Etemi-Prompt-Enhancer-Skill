name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Prompt Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Validate enhanced prompt example
        run: |
          python scripts/check_prompt.py examples/enhanced-prompt.md

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Validate all example prompts
        run: |
          for f in examples/*.md; do
            echo "Validating $f..."
            python scripts/check_prompt.py "$f" || exit 1
          done

  lint:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Check formatting with black
        run: |
          black --check scripts/ tests/

      - name: Check imports with isort
        run: |
          isort --check-only scripts/ tests/

      - name: Lint with flake8
        run: |
          flake8 scripts/ tests/ --max-line-length=100 --ignore=E203,W503